name: CI & Quality Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic

      - name: Run Schema & Integration Verification
        run: |
          python tests/test_verification.py

      - name: Verify TypeScript & Samples Syntax
        run: |
          python -c "
          import os
          assert os.path.exists('quickstart/gemini_nextjs_route.ts'), 'Next.js route sample missing'
          assert os.path.exists('quickstart/gemini_invoice_parser_lite.py'), 'Python parser sample missing'
          print('[PASS] All quickstart contracts and source files verified.')
          "
